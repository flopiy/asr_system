<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>ASR Full Dashboard</title>
  <style>
    body { 
      margin: 0; padding: 20px; font-family: 'Segoe UI', sans-serif; 
      background: #1a1a1a; color: white; display: flex; flex-direction: column; height: 95vh; 
    }
    .main-container { flex: 1; display: flex; flex-direction: column; gap: 20px; max-width: 1200px; margin: 0 auto; width: 100%; }
    
    /* Вікно самої трансляції */
    .video-container {
      width: 100%;
      height: 450px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid #333;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video { width: 100%; height: 100%; object-fit: contain; }

    #transcript-display { 
      flex: 1; background: rgba(255,255,255,0.05); border-radius: 12px; padding: 20px; 
      font-size: 20px; line-height: 1.5; overflow-y: auto; color: #00ff00;
      font-family: 'Courier New', monospace; border: 1px solid #333; white-space: pre-wrap;
    }
    .controls { display: flex; gap: 15px; background: #2c3e50; padding: 15px; border-radius: 12px; align-items: center; }
    button { padding: 10px 20px; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
    #start { background: #4a90e2; color: white; }
    #start.recording { background: #e74c3c; }
  </style>
</head>
<body>
  <div class="main-container">
    <div class="controls">
        <h2 style="margin: 0;">🎙 Live Stream & ASR</h2>
        <button id="start">▶ Start Transcription</button>
        <span id="status" style="padding: 5px 10px; border-radius: 15px; background: #555;">Ready</span>
    </div>

    <div class="video-container">
        <video id="tab-video" autoplay playsinline muted></video>
    </div>

    <div id="transcript-display">Очікування трансляції...</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
