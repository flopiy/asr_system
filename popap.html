<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <style>
    body { 
      width: 400px; 
      font-family: 'Segoe UI', sans-serif; 
      padding: 15px; 
      background: #f5f7fa; 
      margin: 0;
    }
    
    .container { 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }
    
    .header { 
      text-align: center; 
      border-bottom: 2px solid #ddd; 
      padding-bottom: 10px; 
      position: relative;
    }
    
    #status { 
      font-size: 11px; 
      padding: 2px 8px; 
      border-radius: 10px; 
      background: #ddd; 
      position: absolute;
      right: 0;
      top: 5px;
    }
    
    #start { 
      background: #4a90e2; 
      color: white; 
      border: none; 
      padding: 12px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      transition: all 0.3s;
    }
    
    #start.recording { 
      background: #e74c3c; 
      animation: pulse 1.5s infinite; 
    }
    
    #transcript-display { 
      height: 200px; 
      background: white; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      padding: 10px; 
      overflow-y: auto; 
      font-size: 13px; 
      white-space: pre-wrap; 
      font-family: 'Courier New', monospace;
    }
    
    .btn-group {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .btn-primary {
      background: #4a90e2;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      flex: 1;
      transition: background 0.3s;
    }
    
    .btn-primary:hover {
      background: #357abd;
    }
    
    .btn-secondary {
      background: white;
      border: 1px solid #ddd;
      padding: 10px 15px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      flex: 1;
      transition: background 0.3s;
    }
    
    .btn-secondary:hover {
      background: #f0f0f0;
    }
    
    .btn-danger {
      background: #e74c3c;
      color: white;
    }
    
    /* Стилі для секції LLM */
    .llm-settings {
      background: #fff;
      border-radius: 8px;
      padding: 12px;
      border: 1px solid #e0e0e0;
    }
    
    .llm-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      cursor: pointer;
      user-select: none;
    }
    
    .llm-header h4 {
      margin: 0;
      color: #333;
      font-size: 14px;
    }
    
    .toggle-icon {
      transition: transform 0.3s;
    }
    
    .toggle-icon.expanded {
      transform: rotate(90deg);
    }
    
    .llm-content {
      display: none;
      gap: 10px;
      flex-direction: column;
    }
    
    .llm-content.expanded {
      display: flex;
    }
    
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    
    .form-group label {
      font-size: 12px;
      color: #666;
      font-weight: 600;
    }
    
    .form-group input, .form-group select, .form-group textarea {
      padding: 8px;
      border: 1px solid #ddd;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }
    
    .form-group textarea {
      min-height: 60px;
      resize: vertical;
    }
    
    .form-row {
      display: flex;
      gap: 10px;
    }
    
    .form-row .form-group {
      flex: 1;
    }
    
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .checkbox-group input[type="checkbox"] {
      width: auto;
    }
    
    .saved-configs {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #ddd;
    }
    
    .config-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 5px;
      background: #f5f5f5;
      border-radius: 4px;
      margin-bottom: 5px;
      font-size: 11px;
    }
    
    .config-item button {
      padding: 2px 5px;
      font-size: 10px;
      background: #4a90e2;
      color: white;
      border: none;
      border-radius: 3px;
      cursor: pointer;
    }
    
    .config-item button.delete {
      background: #e74c3c;
    }
    
    @keyframes pulse { 
      0% { opacity: 1; } 
      50% { opacity: 0.8; } 
      100% { opacity: 1; } 
    }
    
    /* Індикатор процесу */
    .processing-indicator {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #4a90e2;
    }
    
    .processing-indicator.active {
      display: flex;
    }
    
    .spinner {
      width: 16px;
      height: 16px;
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4a90e2;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h3>🎙️ ASR Transcriber Pro</h3>
      <span id="status">Ready</span>
    </div>
    
    <button id="start">▶ Start Transcription</button>
    
    <!-- Секція LLM налаштувань -->
    <div class="llm-settings">
      <div class="llm-header" id="toggleLLM">
        <span class="toggle-icon">▶</span>
        <h4>🧠 Пост-обробка тексту (LLM)</h4>
      </div>
      
      <div class="llm-content" id="llmContent">
        <div class="form-group">
          <label>Провайдер:</label>
          <select id="llmProvider">
            <option value="openrouter">OpenRouter</option>
            <option value="openai">OpenAI</option>
            <option value="anthropic">Anthropic Claude</option>
            <option value="local">Локальний (Ollama)</option>
            <option value="custom">Свій API</option>
          </select>
        </div>
        
        <div class="form-group">
          <label>API Key:</label>
          <input type="password" id="apiKey" placeholder="sk-...">
        </div>
        
        <div class="form-group">
          <label>Модель:</label>
          <input type="text" id="modelName" placeholder="gpt-4, claude-3, llama3...">
        </div>
        
        <div class="form-group">
          <label>API Endpoint (для custom):</label>
          <input type="url" id="apiEndpoint" placeholder="https://api.example.com/v1">
        </div>
        
        <div class="form-group">
          <label>Системний промпт:</label>
          <textarea id="systemPrompt" rows="3">Ти професійний редактор. Виправ граматичні, пунктуаційні та стилістичні помилки. Збережи зміст і сенс тексту. Відповідай тільки виправленим текстом.</textarea>
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label>Температура:</label>
            <input type="number" id="temperature" step="0.1" min="0" max="2" value="0.3">
          </div>
          <div class="form-group">
            <label>Макс. токенів:</label>
            <input type="number" id="maxTokens" value="1000">
          </div>
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="autoProcess" checked>
          <label for="autoProcess">Автоматично обробляти текст після транскрибації</label>
        </div>
        
        <div class="checkbox-group">
          <input type="checkbox" id="saveHistory">
          <label for="saveHistory">Зберігати історію обробки</label>
        </div>
        
        <div class="btn-group">
          <button class="btn-secondary" id="saveConfig">💾 Зберегти конфіг</button>
          <button class="btn-secondary" id="testLLM">🔍 Тест</button>
        </div>
        
        <!-- Збережені конфігурації -->
        <div class="saved-configs" id="savedConfigs">
          <small style="color:#666;">Збережені конфігурації:</small>
          <div id="configsList"></div>
        </div>
      </div>
    </div>
    
    <div id="processingIndicator" class="processing-indicator">
      <div class="spinner"></div>
      <span>Обробка тексту...</span>
    </div>
    
    <div class="btn-group">
      <button class="btn-primary" id="processText" disabled>✨ Обробити текст</button>
    </div>
    
    <div id="transcript-display">Тут з'явиться текст...</div>
    
    <div class="btn-group">
      <button id="download-txt" class="btn-secondary" disabled>📄 TXT</button>
      <button id="download-doc" class="btn-secondary" disabled>📝 DOC</button>
      <button id="open-full" class="btn-secondary">🔲 Dashboard</button>
    </div>
    
    <div class="btn-group">
      <button id="clear-history" class="btn-secondary btn-danger">🗑️ Очистити</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
